[project]
name = "quicksql"
version = "0.1.0"
description = "quicksql — a CLI notebook for SQL, driven by comment directives"
readme = "README.md"
authors = [
    { name = "Yevgeny Bulochnik", email = "yevgeny.bulochnik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "polars>=1.0",
    "typer>=0.12",
    "watchfiles>=0.24",
    "textual>=0.80",
    "sqlglot>=25",  # statement splitting for multi-statement cells (core, engine-dialect aware)
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3", "pyarrow>=15"]
postgres = ["psycopg[binary]>=3"]
visidata = ["visidata>=3"]
lsp = ["pygls>=1.3"]  # sqlglot is a core dependency

[project.scripts]
quicksql = "quicksql.cli:app"
qsql = "quicksql.cli:app"  # short alias

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "openpyxl>=3.1",
    "pyarrow>=15",  # arrow-type normalization tests only; core stays pyarrow-free
    "pygls>=1.3",  # lsp extra, in dev so the language-server tests run by default
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m \"not (network or bigquery or postgres or terminal)\""
markers = [
    "network: needs network access (deselected by default)",
    "bigquery: needs the compose bigquery-emulator (deselected by default)",
    "postgres: needs a Postgres server (deselected by default)",
    "terminal: drives the TUI in a real tmux terminal (deselected by default)",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
